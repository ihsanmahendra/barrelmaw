<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#2a9fd0">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>Barrelmaw</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: white; background-color: #2a9fd0; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

/* ---- Pirate loading screen ---- */
#loading {
	position: absolute; inset: 0; z-index: 5;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	background: #2a9fd0 url("loading_bg.jpg") center / cover no-repeat;
	font-family: 'Trebuchet MS', 'Segoe UI', 'Noto Sans', Arial, sans-serif;
	transition: opacity 0.45s ease;
	visibility: hidden;
}
#loading.fade { opacity: 0; pointer-events: none; }
#loading::before { /* soft dark vignette so the text stays readable on any phone */
	content: ""; position: absolute; inset: 0;
	background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(10,30,50,0.45) 100%);
}
#loading > * { position: relative; }
#title {
	font-size: clamp(36px, 11vw, 64px); font-weight: 900; letter-spacing: 2px;
	color: #ffd166; margin: 0 0 4vh;
	text-shadow: 0 3px 0 #8a5a1a, 0 6px 0 #3a261a, 0 10px 18px rgba(0,0,0,0.55);
	-webkit-text-stroke: 2px #3a261a; paint-order: stroke fill;
}
#pirate {
	width: clamp(120px, 38vw, 190px); height: auto;
	animation: bob 1.6s ease-in-out infinite;
	filter: drop-shadow(0 10px 8px rgba(0,0,0,0.4));
}
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
#bar {
	margin-top: 4vh; width: min(78vw, 380px); height: 30px; box-sizing: border-box;
	border: 4px solid #3a261a; border-radius: 16px; background: #5a3a22;
	box-shadow: 0 5px 0 #2a1a10, 0 10px 18px rgba(0,0,0,0.45); overflow: hidden; position: relative;
}
#fill {
	height: 100%; width: 0%; border-radius: 10px;
	background: linear-gradient(#ff7a95, #ef476f 55%, #c4284d);
	box-shadow: inset 0 3px 0 rgba(255,255,255,0.35);
	transition: width 0.25s ease-out;
}
#fill.indeterminate { width: 40% !important; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
#percent {
	margin-top: 14px; font-size: 22px; font-weight: 800; color: #fff4dc;
	text-shadow: 0 2px 0 #3a261a, 0 0 10px rgba(0,0,0,0.5);
}
#tip {
	margin-top: 8px; padding: 0 24px; text-align: center; min-height: 2.6em; max-width: 340px;
	font-size: 16px; color: #fff4dc; text-shadow: 0 2px 0 #3a261a, 0 0 8px rgba(0,0,0,0.6);
}
#notice {
	display: none; max-width: min(86vw, 420px); margin-top: 3vh; padding: 14px 18px; text-align: center;
	background: #f3e2bb; color: #3b2a1e; border: 4px solid #8a5a30; border-radius: 16px;
	font-size: 16px; line-height: 1.4; box-shadow: 0 8px 18px rgba(0,0,0,0.4);
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.js.icon.png" />
		<link rel="apple-touch-icon" href="index.js.apple-touch-icon.png"/>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>

		<div id="loading">
			<h1 id="title">Barrelmaw</h1>
			<img id="pirate" src="loading_pirate.png" alt="">
			<div id="bar"><div id="fill"></div></div>
			<div id="percent">Loading...</div>
			<div id="tip"></div>
			<div id="notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4285376,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('loading');
	const fill = document.getElementById('fill');
	const percent = document.getElementById('percent');
	const tip = document.getElementById('tip');
	const notice = document.getElementById('notice');
	const bar = document.getElementById('bar');

	const TIPS = [
		'Tap a card to preview it before you play it.',
		'Bombs smash the barrels around them.',
		'Finish in few turns to earn 3 stars.',
		'Iron barrels take two hits to break.',
		'Supply crates give you a free cannonball.',
		'Cursed skulls weaken your next cannonball.',
		'New cards join your deck every 10 stages.',
	];
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	function nextTip() { tip.textContent = TIPS[tipIndex % TIPS.length]; tipIndex++; }
	nextTip();
	const tipTimer = setInterval(nextTip, 3200);

	let initializing = true;

	function showOverlay() { overlay.style.visibility = 'visible'; }
	function hideOverlay() {
		if (!initializing) { return; }
		initializing = false;
		clearInterval(tipTimer);
		overlay.classList.add('fade');
		setTimeout(function () { overlay.remove(); }, 500);
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'An unknown error occurred.';
		if (err instanceof Error) { text = err.message; } else if (typeof err === 'string') { text = err; }
		notice.innerHTML = '';
		text.split('\n').forEach(function (line, i) {
			if (i > 0) { notice.appendChild(document.createElement('br')); }
			notice.appendChild(document.createTextNode(line));
		});
		notice.style.display = 'block';
		bar.style.display = 'none'; percent.style.display = 'none'; tip.style.display = 'none';
		showOverlay();
		clearInterval(tipTimer);
		initializing = false;
	}

	showOverlay();
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let registration;
			try { registration = navigator.serviceWorker.getRegistration(); } catch (err) { registration = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				registration.then(function (r) { return r != null ? Promise.reject(new Error('Service worker already exists.')) : r; }).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) { setTimeout(function () { resolve(); }, 2000); }),
			]).then(function () { window.location.reload(); }).catch(function (err) { console.error('Error while registering service worker:', err); });
		} else {
			displayFailureNotice('Oops!\nYour browser is missing something the game needs:\n' + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					fill.classList.remove('indeterminate');
					const pct = Math.min(100, Math.round(current / total * 100));
					fill.style.width = pct + '%';
					percent.textContent = 'Loading... ' + pct + '%';
				} else {
					fill.classList.add('indeterminate');
					percent.textContent = 'Loading...';
				}
			},
		}).then(function () {
			percent.textContent = 'Ready!';
			hideOverlay();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
